<!doctype html>
<html lang="zh-CN" data-brand="copper" data-theme="dark" data-density="cozy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mem · 思源记忆</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <b>mem</b>
    <span>思源记忆</span>
  </div>

  <div class="status" id="status">
    <i class="dot idle" id="status-dot"></i>
    <span class="status-text" id="status-text">读取中…</span>
    <span class="status-sub" id="status-sub"></span>
  </div>

  <label class="search" role="search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="搜索条目、话题、会话" autocomplete="off" spellcheck="false">
    <kbd>⌘K</kbd>
  </label>

  <div class="right">
    <span class="count-pill" id="counts">—</span>

    <div class="seg" id="density" role="group" aria-label="密度">
      <button data-density="compact" title="紧凑">紧凑</button>
      <button data-density="cozy" title="标准">标准</button>
      <button data-density="spacious" title="宽松">宽松</button>
    </div>

    <div class="swatches" role="group" aria-label="主题色">
      <button class="sw" data-brand="copper" aria-label="铜金"></button>
      <button class="sw" data-brand="vermilion" aria-label="朱砂"></button>
      <button class="sw" data-brand="blue" aria-label="蓝"></button>
      <button class="sw" data-brand="moss" aria-label="苔绿"></button>
    </div>

    <button class="icon-btn" id="btn-settings" aria-label="设置">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.35a1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.63 15 1.7 1.7 0 0 0 3.07 14H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.65 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.63 1.7 1.7 0 0 0 10 3.07V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.54 1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.37 9c.12.4.48.7.9.7H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1.3Z"/></svg>
    </button>
    <button class="icon-btn" id="theme" aria-label="切换明暗">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>
  </div>
</header>

<div class="alertbar" id="alertbar" hidden>
  <span class="alert-text" id="alert-text"></span>
  <button class="btn" id="alert-clear">知道了</button>
</div>

<div class="shell" id="shell">
  <nav class="pane" aria-label="话题">
    <div class="nav-tabs" role="tablist">
      <button role="tab" aria-selected="true" data-view="topics">话题</button>
      <button role="tab" aria-selected="false" data-view="sessions">会话</button>
      <button role="tab" aria-selected="false" data-view="timeline">时间线</button>
    </div>
    <div class="nav-meta">
      <span id="topic-count">—</span>
      <span class="select-wrap">
        <select id="sort" aria-label="排序方式">
          <option value="count">按条目数</option>
          <option value="last">按时间</option>
        </select>
        <svg class="chev" width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </span>
    </div>
    <ul class="list" id="topics"><li class="empty">读取中…</li></ul>
  </nav>

  <div class="handle" role="separator" aria-orientation="vertical" aria-label="调整话题栏宽度" tabindex="0" data-edge="left"></div>

  <main class="pane" aria-label="条目">
    <div class="flow-head">
      <h2 id="flow-title">全部条目</h2>
      <span class="sub" id="flow-sub"></span>
      <div class="chips" id="chips"></div>
    </div>

    <div class="flow-loading" id="flow-loading" hidden>
      <div class="loading-line"><b class="pulse"></b>正在翻条目…</div>
      <ul class="flow" id="skeleton" aria-hidden="true"></ul>
    </div>

    <ul class="flow" id="flow"></ul>
  </main>

  <div class="handle" role="separator" aria-orientation="vertical" aria-label="调整详情栏宽度" tabindex="0" data-edge="right"></div>

  <aside class="pane detail" id="detail" aria-label="详情">
    <p class="empty">选一条看详情</p>
  </aside>
</div>

<div class="settings-scrim" id="settings-scrim" hidden></div>
<aside class="settings" id="settings" hidden aria-label="设置">
  <div class="settings-head">
    <div class="tabs" id="settings-tabs" role="tablist">
      <button role="tab" data-tab="model" aria-selected="true">模型</button>
      <button role="tab" data-tab="prompt" aria-selected="false">提示词</button>
      <button role="tab" data-tab="params" aria-selected="false">参数</button>
    </div>
    <button class="icon-btn" id="settings-close" aria-label="关闭设置">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="settings-body" id="settings-body"></div>
</aside>

<div class="toast" id="toast" hidden></div>

<div class="drawer-scrim" id="scrim" hidden></div>
<section class="drawer" id="drawer" hidden aria-label="worker">
  <div class="drawer-head">
    <div class="tabs" id="drawer-tabs" role="tablist">
      <button role="tab" data-tab="queue" aria-selected="true">队列 <b id="tab-queue">0</b></button>
      <button role="tab" data-tab="dead" aria-selected="false">死信 <b id="tab-dead">0</b></button>
      <button role="tab" data-tab="log" aria-selected="false">日志</button>
      <button role="tab" data-tab="model" aria-selected="false">模型</button>
    </div>
    <span class="spacer"></span>
    <button class="btn" id="btn-retry">重跑死信</button>
    <button class="btn primary" id="btn-run">跑一轮</button>
    <button class="icon-btn" id="drawer-close" aria-label="收起">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</section>

<footer class="worker" id="worker">
  <span class="grp"><i class="dot idle" id="w-dot"></i><span id="w-state">读取中…</span></span>
  <span class="grp">队列 <b class="num" id="w-queue">0</b></span>
  <span class="grp">今日 <b class="num" id="w-usage">0</b> 次 / 失败 <b class="num" id="w-failed">0</b></span>
  <span class="grp" id="w-model">—</span>
  <span class="grp wide">写入 <b class="num" id="w-written">0</b> · 合并 <b class="num" id="w-merge">0%</b></span>
  <span class="spacer"></span>
  <span class="grp" id="w-last">—</span>
  <button class="toggle" id="btn-drawer"><span id="drawer-label">展开</span>
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
  </button>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
