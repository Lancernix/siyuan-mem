# 中心节点：一个 mem 容器，接在思源自己的网络上。
#
# 思源不用改。mem 只是它的一个客户端，走 6806 那套 HTTP API。
name: siyuan-mem

services:
  mem:
    # 构建上下文是仓库根（要拷 src 和 package.json），Dockerfile 在 deploy/ 下。
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: siyuan-mem:0.1.0
    container_name: siyuan-mem
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    volumes:
      # 配置、队列、原文索引、日志都在这里。备份这一个目录就够。
      - ./data:/data
    ports:
      # 默认只绑回环：边缘机器要么走 Tailscale（推荐），要么在这台机器上放一个
      # 反代做 TLS 终止再暴露。直接写 "7788:7788" 等于把写入通道摊在公网上，
      # 而 token 是在 HTTP 里明文传的。
      - "127.0.0.1:7788:7788"
    networks:
      - siyuan

  # 面板：看状态、查条目、看队列。和 mem 用同一份镜像、同一个数据卷——它读的就是
  # 同一套状态，不需要另开一份。
  #
  # 默认不启动（profile）：面板显示的是记忆库正文，没设密码它自己也会拒绝绑非回环
  # 地址。要开：在 deploy/.env 里写 MEM_PANEL_AUTH=用户名:密码，然后
  #   docker compose --profile panel up -d
  panel:
    profiles: ["panel"]
    image: siyuan-mem:0.1.0
    container_name: siyuan-mem-panel
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MEM_PANEL_AUTH: ${MEM_PANEL_AUTH:-}
    volumes:
      - ./data:/data
    # 绑 0.0.0.0 是因为要经容器网络被 nginx 访问；不 publish 端口，外面碰不到。
    # --allow-host 是 nginx 转发过来的 Host，不列进来会被 DNS rebinding 那道闸挡掉。
    command: ["ui", "--port", "7787", "--bind", "0.0.0.0", "--allow-host", "${PANEL_HOST:-mem.lancernix.space}"]
    networks:
      - siyuan

networks:
  siyuan:
    external: true
    # 这台机器上思源和 nginx 共用一个自建网络 web_common（不是 compose 默认的
    # <项目名>_default）。换机器时先查：docker network ls | grep -i -E "siyuan|web"
    name: ${SIYUAN_NET:-web_common}
