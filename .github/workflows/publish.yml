# 发版走 npm Trusted Publishing（OIDC），仓库里不存任何 npm token。
#
# 版本真源是 Release 的 tag（v<版本>）。仓库里 package.json 永远是占位符
# 0.0.0-development；CI 把 tag 的版本临时写进发布副本，publish 完 runner 销毁，
# 不回写、不额外提交，也就不会二次触发 workflow。
#
# 一次性前提（只做一次）：
#   1. 包必须已存在于 npm —— 0.1.0 已手动发过。
#   2. npmjs.com → 包设置 → Trusted Publisher → GitHub Actions，填：
#        Organization or user: Lancernix
#        Repository:            siyuan-mem
#        Workflow filename:     publish.yml
#        Environment:           留空
#        Allowed actions:       勾上 npm publish
#      大小写敏感，repository.url 必须与这个仓库一致。
#
# 之后每次发版：push 代码 → 在 GitHub 建一个 tag 为 v<版本> 的 Release。
# 想跳过网页，也可以在 Actions 页手动跑 workflow_dispatch 并填版本号。

name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本，如 0.1.1（不带 v）'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # 用 GitHub 的 OIDC 换 npm 的短期发布凭证

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0   # 不写 packageManager：pnpm 12 会把自己塞进 lock（一堆平台二进制）

      - uses: actions/setup-node@v4
        with:
          node-version: '24'   # engines 要求 >= 24
          # 不设 registry-url：OIDC 不需要 .npmrc 里的 _authToken，
          # 设了反而可能让 npm 跳过 OIDC 回退。

      # Trusted Publishing 要求 npm CLI >= 11.5.1，setup-node 自带的版本不够。
      - name: 升级 npm
        run: npm install -g npm@^11.5.1

      - run: pnpm install --frozen-lockfile   # 与本机 mise 的 pnpm latest / Node 24 对齐
      - run: pnpm test   # 308 项，固定串行，并发会互相抢 HOME

      - name: 从 tag 取版本，只改 CI 副本
        env:
          RAW: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          ver="${RAW#v}"
          if ! printf '%s' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::版本 $RAW 不是 v<semver> 格式，拒绝发布"
            exit 1
          fi
          name="$(node -p "require('./package.json').name")"
          if npm view "$name@$ver" version >/dev/null 2>&1; then
            echo "::error::$name@$ver 已经发过了，换个版本号"
            exit 1
          fi
          VER="$ver" node -e 'const fs=require("fs");const p=require("./package.json");p.version=process.env.VER;fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'
          echo "本次发版版本 $ver"

      - name: 发布前看一眼包内容
        run: npm pack --dry-run

      # 不要设 NODE_AUTH_TOKEN。npm CLI 检测到 OIDC 环境会自动用短期凭证，
      # 并自动生成 provenance 签名；设了 token（哪怕是空串）会把它顶掉。
      - name: 发布
        run: npm publish --access public
